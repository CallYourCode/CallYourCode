  <g transform="translate(0.6805,-4.6646) scale(0.183227)">
  <!-- The mark at 24dp, for the Android notification small icon and the
       favicon. NOT logo.svg scaled down: Android throws the artwork away, takes
       the alpha channel and paints a flat white silhouette at about 24
       density-independent pixels, so an outline drawing with an empty interior
       collapses. See brand/README.md.

       Three things make it survive:
         - the phone is a solid body, not an outline
         - the handset is a second solid with a carved gap around it, because
           the gap between handset and body is what reads as "desk phone"
         - the prompt is knocked out of the body, its two glyphs laid out with
           enough clearance that they stay separate at 24dp. The dial circle is
           dropped; at this size it merges with the prompt inside it.

       Black ink on transparent, matching logo.svg. Only the alpha matters.

       The two visible paths carry class="ink". scripts/build-brand.sh inlines
       this file into cyc-favicon.svg and recolours through that class, so a CSS
       rule beats the fill attribute and the mask's own black stays black. Keep
       the class if you edit them.

       2026-08-01: the prompt strokes went from 28.32 to 16, round caps kept.
       Shown six weights (28.32, 22, 18, 16) against both cap styles at large,
       56px and a true 16px, he picked 16 round: at 28.32 the > and _ read as
       fat sausages, and every square-capped variant "doesn't gel with the rest
       of the logo which is roundish everywhere and doesn't have sharp angles."
       This widens the clearance the note below is about rather than narrowing
       it, so the 24dp constraint is looser now, not tighter.

       2026-07-30: the prompt was repositioned. It sat at 61.2% down the body
       and spanned 62.1% of its width, where logo.svg puts it at 54.8% and
       26.7%. Example saw it as too low and too far apart, and the measurement
       agreed on both, with the spread being the larger error. The two glyphs
       cannot simply be pulled together: at 24dp they need about 2px of
       clearance and the strokes here are 9.2% of the mark width against
       logo.svg's 2.5%, so copying its spacing lands at 1.17px and fails. The
       way out is what logo.svg itself does, drop the bar below the chevron so
       the clearance is spent vertically. This is the "by eye" variant of six
       that were rendered and gated at a real 24dp: raised 16.7, glyphs 18.8
       closer, bar dropped 10.1 and shortened 15%. Gap at 24dp is 2.20px. -->
