# cyc testbench matrix (adapters design, section 9).
#
# A cell is one container running one (harness, version, mux, scenario). The
# runner (run.ts) expands a tier into cells, builds the images it needs, and
# runs the cells N-wide under `timeout --kill-after=10`.
#
# Versions here are npm/dist pins. "primary" is the pin the product supports
# today; "compat" is the last two minors before it (nightly tier only).

images:
  base: cyc-testbench/base
  # Image tag for the base is a date; bump it when base.Dockerfile changes.
  base_tag: "2026-09-02"

harnesses:
  claude:
    package: "@anthropic-ai/claude-code"
    primary: "2.1.257"
    compat: ["2.1.200", "2.0.90"]
    dialect: anthropic-messages
  codex:
    package: "@openai/codex"
    primary: "0.148.0"
    compat: ["0.147.0", "0.146.0"]
    dialect: openai-responses
  opencode:
    package: "opencode-ai"
    primary: "1.18.19"
    compat: ["1.17.10", "1.16.6"]
    dialect: openai-chat
  pi:
    package: "@earendil-works/pi-coding-agent"
    primary: "0.84.3"
    compat: ["0.83.0", "0.82.0"]
    dialect: openai-chat

muxes:
  tmux:
    primary: "3.4"
    # tmux-multi.Dockerfile builds these from source for the nightly compat
    # sweep; the pr tier uses the distro 3.4 baked into the base image.
    compat: ["3.2a", "3.3a", "3.5a", "3.7b"]
  herdr:
    primary: "0.8.2"
    compat: []
    # Set by the herdr-in-docker probe (README, "Herdr in docker"). When false,
    # herdr cells get verdict `skipped: herdr-no-docker` unless run.ts is given
    # --host with HERDR_SOCKET_PATH.
    in_docker: true

cell:
  network: none
  memory: 2g
  cpus: 2
  pids_limit: 512
  # NET_ADMIN only so cell/entrypoint.sh can add one dummy interface: werift
  # never offers loopback ICE candidates, so a netns with only `lo` can never
  # open the sealed DataChannel. The netns still links to nothing.
  cap_add: [NET_ADMIN]
  # seconds; the runner wraps `docker run` in `timeout --kill-after=10 <s>`
  timeout_s: 420
  # ports inside the container (loopback is private per cell)
  engine_port: 10101
  fake_model_port: 4141

scenarios:
  - id: 01-bring-up
  - id: 02-deliver-verified
  - id: 03-disconnect
  - id: 04-rollover
  - id: 05-close-reopen
  - id: 06-engine-restart
  - id: 07-mux-restart
  - id: 08-overlay-input
  - id: 09-cron-redelivery
  - id: 10-two-muxes
    # needs both muxes in one cell; expands once per harness with mux=both
    mux: both
  - id: 11-attach-slot
  - id: 12-nested-child
  - id: 13-version-gate
    # runs the harness once per pin and records supported/unsupported
    per_version: true

tiers:
  pr:
    enabled: true
    harnesses: [claude, codex, opencode, pi]
    versions: primary
    muxes: [tmux, herdr]
    scenarios: all
    jobs: 3
  nightly:
    enabled: true
    harnesses: [claude, codex, opencode, pi]
    versions: primary+compat
    muxes: [tmux, herdr]
    tmux_versions: primary+compat
    scenarios: all
    jobs: 3
  real:
    # Real-model tier: same cells against the real providers with real keys.
    # DESIGNED, NOT RUN. Stays disabled until the owner turns it on by hand;
    # run.ts refuses to expand it while enabled is false.
    enabled: false
    harnesses: [claude, codex, opencode, pi]
    versions: primary
    muxes: [tmux]
    scenarios: [01-bring-up, 02-deliver-verified]
    network: bridge
    jobs: 1
