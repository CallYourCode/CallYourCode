<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="utf-8" />
    <title>CallYourCode</title>

    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no,interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#212121" />
    <meta name="color-scheme" content="dark" />

    <style>
      html,
      body {
        background: #212121;
      }
    </style>

    <link rel="manifest" href="./pwa/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icons/app-192.png" />

    <link rel="icon" href="./pwa/icons/favicon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CallYourCode" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <style>
      .cyc-rotate {
        display: none;
      }
      /* A phone actually held in landscape is WIDE (its long edge is the
         width). CSS `orientation`/height alone also match a phone in PORTRAIT
         once the on-screen keyboard opens: the keyboard shrinks the viewport
         height below the width, flipping the aspect ratio to landscape while
         the phone is upright. min-width keeps this overlay to a real landscape
         phone and off a keyboard-shrunk portrait one. */
      @media (orientation: landscape) and (max-height: 500px) and (min-width: 480px) and (pointer: coarse) {
        .cyc-rotate {
          display: flex;
          position: fixed;
          inset: 0;

          z-index: 2147483000;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          background: #212121;
          color: #fff;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          text-align: center;
          padding: 1.5rem;
        }
        .cyc-rotate-mark {
          width: 2rem;
          height: 3.25rem;
          border: 2px solid #c98652;
          border-radius: 0.375rem;
          transform: rotate(90deg);
          margin-bottom: 0.5rem;
        }
        .cyc-rotate-title {
          font-size: 1.0625rem;
          font-weight: 500;
        }
        .cyc-rotate-note {
          font-size: 0.875rem;
          color: #aaa;
          max-width: 22rem;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BgtKAYb7.js"></script>
  </head>
  <body>
    <div id="cyc-app"></div>

    <div class="cyc-rotate" role="alert">
      <div class="cyc-rotate-mark"></div>
      <div class="cyc-rotate-title">Turn your phone upright</div>
      <div class="cyc-rotate-note">
        CallYourCode is portrait on a phone. Everything is still here.
      </div>
    </div>
  </body>
</html>
