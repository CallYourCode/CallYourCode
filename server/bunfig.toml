[install]
# Supply-chain cooldown: never install a version published less than 14 days
# ago (seconds). Blunts freshly-compromised-package attacks before they are
# caught + yanked.
minimumReleaseAge = 1209600

[test]
# Share the scratch HOME/data guard before any app-server test reads defaults.
preload = ["../engine/agent-engine/src/test-utils/homeguard.ts"]
