<!doctype html>
<!--
  Archetype: DIAGRAM PAGE. Two mermaid diagrams (a sequence and a state
  machine) behind a segmented toggle, re-rendered when the app theme flips.
  Mermaid loads from the CDN as an ES module -- allowed, because the sandbox
  permits https scripts -- with a visible fallback when it cannot load.
  cyc APIs: none needed; a diagram only explains.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout flow diagrams</title>
<style>
  :root {
    --bg: var(--cyc-bg, #f4f4f5); --surface: var(--cyc-surface, #ffffff);
    --text: var(--cyc-text, #111114); --muted: var(--cyc-muted, #707579);
    --accent: var(--cyc-accent, #3390ec); --border: var(--cyc-border, #dfe1e5);
  }
  html[data-cyc-theme="dark"] {
    --bg: var(--cyc-bg, #181818); --surface: var(--cyc-surface, #212121);
    --text: var(--cyc-text, #f2f2f5); --muted: var(--cyc-muted, #aaaaaa);
    --accent: var(--cyc-accent, #8774e1); --border: var(--cyc-border, #3a3a3c);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 24px;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 14px 12px 0; }
  h1 { font-size: 19px; margin: 0 0 3px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px;
  }
  .seg button {
    flex: 1; min-height: 44px; border: 0; border-radius: 9px;
    background: none; color: var(--muted); font: inherit; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px; overflow-x: auto;
  }
  .panel svg { max-width: 100%; height: auto; }
  .cap { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }
  .fallback { color: var(--muted); font-style: italic; padding: 18px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Checkout flow</h1>
  <p class="sub">The same feature from two angles: what talks to what, and what state an order can be in.</p>

  <div class="seg" role="tablist">
    <button id="b-seq" aria-pressed="true">Sequence</button>
    <button id="b-state" aria-pressed="false">Order states</button>
  </div>

  <div class="panel" id="stage"><div class="fallback">Rendering…</div></div>
  <p class="cap" id="cap"></p>
</div>

<script type="module">
  const SEQ = `sequenceDiagram
    autonumber
    participant App as Phone app
    participant API as Checkout API
    participant Pay as Payment provider
    participant Q as Order queue
    App->>API: POST /checkout (cart)
    API->>API: validate stock + price
    API->>Pay: create charge
    alt card accepted
      Pay-->>API: charge id
      API->>Q: enqueue order
      API-->>App: 201 order id
    else card declined
      Pay-->>API: decline reason
      API-->>App: 402 + reason
    end
    Q-->>App: push "order confirmed"`;

  const STATE = `stateDiagram-v2
    [*] --> Draft
    Draft --> Submitted: user pays
    Submitted --> Paid: charge clears
    Submitted --> Failed: charge declined
    Failed --> Submitted: retry card
    Paid --> Shipped: warehouse scan
    Shipped --> Delivered: courier confirm
    Draft --> Cancelled: user abandons
    Submitted --> Cancelled: timeout 15 min
    Delivered --> [*]
    Cancelled --> [*]`;

  const CAPS = {
    seq: 'One tap on Pay, numbered hop by hop. The alt block is the decline path.',
    state: 'Every state an order can sit in; edges name the event that moves it.',
  };

  const stage = document.getElementById('stage');
  const cap = document.getElementById('cap');
  let current = 'seq';
  let mermaid = null;
  let renderSeq = 0;

  try {
    mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;
  } catch (e) {
    stage.innerHTML = '<div class="fallback">Mermaid could not load (offline?). The two diagrams need the network once.</div>';
  }

  const dark = () => document.documentElement.getAttribute('data-cyc-theme') === 'dark';

  async function draw() {
    if (!mermaid) return;
    const my = ++renderSeq; // a slow render must not paint over a newer one
    // re-initialize per render: theme is an init-time setting in mermaid
    mermaid.initialize({ startOnLoad: false, theme: dark() ? 'dark' : 'default',
      sequence: { useMaxWidth: true }, state: { useMaxWidth: true } });
    try {
      const { svg } = await mermaid.render('d' + my, current === 'seq' ? SEQ : STATE);
      if (my !== renderSeq) return;
      stage.innerHTML = svg;
      cap.textContent = CAPS[current];
    } catch (e) {
      if (my === renderSeq) stage.innerHTML = '<div class="fallback">Diagram failed to render: ' + String(e && e.message || e) + '</div>';
    }
  }

  for (const [id, key] of [['b-seq', 'seq'], ['b-state', 'state']]) {
    document.getElementById(id).addEventListener('click', () => {
      current = key;
      document.getElementById('b-seq').setAttribute('aria-pressed', String(key === 'seq'));
      document.getElementById('b-state').setAttribute('aria-pressed', String(key === 'state'));
      draw();
    });
  }

  // the app rewrites data-cyc-theme on <html> when its theme flips
  new MutationObserver(draw).observe(document.documentElement, {
    attributes: true, attributeFilter: ['data-cyc-theme'],
  });

  draw();
</script>
</body>
</html>
