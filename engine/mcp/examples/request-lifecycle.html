<!doctype html>
<!--
  Archetype: STEP-THROUGH. Explaining a flow one step at a time: prev/next
  walk eight steps, each highlighting a stage in a hand-drawn SVG pipeline and
  swapping the narration below it. The "explain visually" shape: when a
  paragraph would make the reader build this picture in their head, build it
  for them and let them walk it.
  cyc APIs: none needed; hand-drawn SVG, no libraries, works offline.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life of a request</title>
<style>
  :root {
    --bg: var(--cyc-bg, #f4f4f5); --surface: var(--cyc-surface, #ffffff);
    --text: var(--cyc-text, #111114); --muted: var(--cyc-muted, #707579);
    --accent: var(--cyc-accent, #3390ec); --border: var(--cyc-border, #dfe1e5);
  }
  html[data-cyc-theme="dark"] {
    --bg: var(--cyc-bg, #181818); --surface: var(--cyc-surface, #212121);
    --text: var(--cyc-text, #f2f2f5); --muted: var(--cyc-muted, #aaaaaa);
    --accent: var(--cyc-accent, #8774e1); --border: var(--cyc-border, #3a3a3c);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 24px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 12px 0; }
  h1 { font-size: 19px; margin: 0 0 3px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px;
  }
  svg { display: block; width: 100%; height: auto; }
  /* the SVG inherits page colours through CSS, so theme flips need no JS */
  .box { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; rx: 10; }
  .box.hot { fill: var(--accent); stroke: var(--accent); }
  .bl { font: 600 13px -apple-system, sans-serif; fill: var(--text); text-anchor: middle; }
  .hot-label { fill: #fff; }
  .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#head); }
  .arrow.hot { stroke: var(--accent); stroke-width: 2.5; }
  #head path { fill: var(--muted); }

  .story {
    min-height: 96px; padding: 12px 4px 2px;
  }
  .story b { color: var(--accent); }
  .story p { margin: 4px 0 0; }
  .stepn { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }

  .nav { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .nav button {
    min-height: 48px; flex: 1; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .nav #next { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav button:disabled { opacity: .45; }
  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .dots i.on { background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Life of a request</h1>
  <p class="sub">What happens between tapping refresh and seeing data. Walk it with next.</p>

  <div class="panel">
    <svg viewBox="0 0 360 300" role="img" aria-label="request pipeline">
      <defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
        <path d="M0,0 L7,3.5 L0,7 Z"/></marker></defs>
      <!-- stages -->
      <rect class="box" data-s="phone" x="10"  y="20"  width="100" height="44"/>
      <text class="bl"  data-s="phone" x="60"  y="47">Phone</text>
      <rect class="box" data-s="cdn"   x="250" y="20"  width="100" height="44"/>
      <text class="bl"  data-s="cdn"   x="300" y="47">CDN edge</text>
      <rect class="box" data-s="lb"    x="250" y="128" width="100" height="44"/>
      <text class="bl"  data-s="lb"    x="300" y="155">Balancer</text>
      <rect class="box" data-s="app"   x="130" y="236" width="100" height="44"/>
      <text class="bl"  data-s="app"   x="180" y="263">App server</text>
      <rect class="box" data-s="cache" x="10"  y="128" width="100" height="44"/>
      <text class="bl"  data-s="cache" x="60"  y="155">Cache</text>
      <rect class="box" data-s="db"    x="10"  y="236" width="100" height="44"/>
      <text class="bl"  data-s="db"    x="60"  y="263">Database</text>
      <!-- edges -->
      <path class="arrow" data-e="phone-cdn" d="M114 42 H 246"/>
      <path class="arrow" data-e="cdn-lb"    d="M300 68 V 124"/>
      <path class="arrow" data-e="lb-app"    d="M262 176 L 216 232"/>
      <path class="arrow" data-e="app-cache" d="M144 232 L 92 178"/>
      <path class="arrow" data-e="app-db"    d="M126 258 H 114"/>
      <path class="arrow" data-e="back"      d="M60 124 C 60 60, 140 46, 240 60" stroke-dasharray="4 4"/>
    </svg>
  </div>

  <div class="story">
    <div class="stepn" id="stepn"></div>
    <p id="text"></p>
  </div>

  <div class="nav">
    <button id="prev">‹ Back</button>
    <button id="next">Next ›</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
  'use strict';
  // each step: which boxes and edges light up, and the narration
  const STEPS = [
    { s: ['phone'], e: [],
      t: '<b>The tap.</b> The app builds GET /feed with an auth token and an ETag of what it already has.' },
    { s: ['phone', 'cdn'], e: ['phone-cdn'],
      t: '<b>Nearest edge first.</b> DNS points at the CDN, so the request lands maybe 30 km away, not at the origin.' },
    { s: ['cdn'], e: [],
      t: '<b>Edge check.</b> A personalised feed is never cached whole, so the edge only terminates TLS and keeps the connection warm.' },
    { s: ['cdn', 'lb'], e: ['cdn-lb'],
      t: '<b>Into the origin.</b> The balancer picks an app server that is alive and least busy. Health checks every few seconds decide "alive".' },
    { s: ['lb', 'app'], e: ['lb-app'],
      t: '<b>The app server.</b> Token verified, feed query planned. Everything after this line is the expensive part.' },
    { s: ['app', 'cache'], e: ['app-cache'],
      t: '<b>Cache first.</b> The hot path: 9 of 10 requests end here in about a millisecond, and that ratio is what keeps the database alive.' },
    { s: ['app', 'db'], e: ['app-db'],
      t: '<b>The miss.</b> This one missed, so the database answers, and the app writes the result back into the cache with a short TTL.' },
    { s: ['phone', 'cache'], e: ['back'],
      t: '<b>The way back.</b> Response retraces the path (dashed). Next refresh with the same ETag is a 304: no body at all.' },
  ];

  let i = 0;
  const $ = s => document.querySelector(s);
  const dots = $('#dots');
  STEPS.forEach(() => dots.appendChild(document.createElement('i')));

  function paint() {
    const st = STEPS[i];
    document.querySelectorAll('[data-s]').forEach(el => {
      const on = st.s.includes(el.dataset.s);
      if (el.classList.contains('box')) el.classList.toggle('hot', on);
      else el.classList.toggle('hot-label', on);
    });
    document.querySelectorAll('[data-e]').forEach(el =>
      el.classList.toggle('hot', st.e.includes(el.dataset.e)));
    $('#stepn').textContent = `STEP ${i + 1} OF ${STEPS.length}`;
    $('#text').innerHTML = st.t;
    $('#prev').disabled = i === 0;
    $('#next').disabled = i === STEPS.length - 1;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }

  $('#prev').addEventListener('click', () => { if (i > 0) { i--; paint(); } });
  $('#next').addEventListener('click', () => { if (i < STEPS.length - 1) { i++; paint(); } });
  paint();
</script>
</body>
</html>
